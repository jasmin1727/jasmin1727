name: Update Featured Projects

on:
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Refresh featured projects
        shell: pwsh
        run: .github/scripts/fetch_repos.ps1
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "jasmin1727"
          git config user.email "thakorjasmin503@gmail.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update featured projects"
          git pull --rebase origin main
          git push